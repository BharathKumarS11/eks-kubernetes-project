apiVersion: apps/v1
kind: Deployment

metadata:
  name: eks-webapp
  namespace: eks-demo

spec:
  replicas: 2

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: eks-webapp

  template:

    metadata:
      labels:
        app: eks-webapp

    spec:

      containers:

        - name: webapp

          image: 896305834488.dkr.ecr.ap-south-1.amazonaws.com/eks-webapp:1.0

          imagePullPolicy: Always

          ports:
            - containerPort: 5000

          envFrom:
            - configMapRef:
                name: eks-webapp-config

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 5000

            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 5000

            initialDelaySeconds: 15
            periodSeconds: 20
